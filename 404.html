<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada</title>
<meta name="description" content="La página que buscas no existe.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F6F3">

<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"Anton";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/anton-latin.woff2) format("woff2")}
@font-face{font-family:"Sora";font-style:normal;font-weight:400 700;font-display:swap;src:url(/fonts/sora-latin.woff2) format("woff2")}
:root{--ground:#F6F6F3;--paper:#fff;--ink:#111413;--ink-2:#3B403E;--muted:#5C625F;--rule:#E3E4DF;--coral:#FF6B4A;--teal-soft:#D9F6F2;--teal-ink:#006B62;--yellow:#FFD84D;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.65 "Sora",system-ui,sans-serif}
a{color:var(--teal-ink);font-weight:600}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;width:min(860px,100% - 32px);margin:auto}
.logo{font-family:"Anton",Impact,sans-serif;font-size:28px;text-decoration:none;color:var(--ink)}
.logo em{font-style:normal;color:var(--coral)}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 15px/1 "Sora",sans-serif;text-decoration:none;color:#fff;background:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:12px 20px;box-shadow:0 4px 0 #000;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #000}
.btn.light{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.t{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:1;margin:0}
.t em{font-style:normal;color:var(--coral)}
main{width:min(860px,100% - 32px);margin:auto;padding:24px 0 56px}
.doc h1{font-size:clamp(44px,9vw,80px)}
.doc .upd{color:var(--muted);font-size:14px;margin:10px 0 28px}
.doc section{background:var(--paper);border:1px solid var(--rule);border-radius:22px;padding:22px 24px;margin-bottom:14px}
.doc h2{font-size:18px;margin:0 0 8px}
.doc p,.doc li{color:var(--ink-2);font-size:15px;margin:0 0 8px}
.doc ul{margin:0;padding-left:20px}
.doc li::marker{color:var(--coral)}
footer{width:min(860px,100% - 32px);margin:auto;padding:0 0 28px;font-size:13px;color:var(--muted)}
.nf{min-height:calc(100svh - 64px);display:grid;place-content:center;text-align:center;padding:24px 16px;gap:18px}
.nf .code{font-family:"Anton",Impact,sans-serif;font-size:clamp(120px,30vw,240px);line-height:.9;color:var(--ink)}
.nf .code span{display:inline-block;background:var(--yellow);border-radius:14px;padding:0 .08em;transform:rotate(-4deg)}
.nf p{margin:0 auto;max-width:28em;color:var(--ink-2)}
.nf .acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}</style>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header class="top"><a class="logo" href="/" aria-label="Volver al inicio">JL<em>.</em></a></header>
<main class="nf" style="width:auto;padding-bottom:24px">
  <div class="code" aria-hidden="true">4<span>0</span>4</div>
  <h1 class="t" style="font-size:clamp(28px,6vw,44px)">Esta página no existe<em>.</em></h1>
  <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
  <div class="acts"><a class="btn" href="/">Ir al portafolio</a><a class="btn light" href="https://portafoliofreelance-jlcg.vercel.app/">Ver mis servicios ↗</a></div>
</main>
</body>
</html>
